<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESM3 Open · WebGPU</title>
<style>:root{color-scheme:dark;font:16px system-ui;background:#0b1320;color:#e3eaf2}body{max-width:1000px;margin:40px auto;padding:0 24px}h1{font-weight:600;letter-spacing:-1px}p{color:#aab8cb;line-height:1.6}textarea,input,select,button{font:inherit;border:1px solid #34445a;border-radius:6px;background:#142237;color:inherit;padding:10px}textarea{width:calc(100% - 22px);font-family:monospace;margin:8px 0;resize:vertical}label{display:inline-block;margin:8px 14px 8px 0}button{cursor:pointer;background:#183d56}button:disabled{opacity:.45;cursor:default}progress{width:100%;height:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101d30;padding:18px;border-radius:6px}canvas{width:100%;height:340px;background:#101d30;border-radius:10px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}small{color:#9fb1c7}</style>
<h1>ESM3 Open <small>WebGPU</small></h1><p>Protein sequence and structure inference on your GPU. Runs locally after weights load. Use underscores for masked residues; load a PDB backbone to condition sequence generation.</p>
<label>Weights URL <input id="base" value="../weights"></label><label>Precision <select id="precision"><option value="fp16">FP16 · 4.14 GB</option><option value="int8">INT8 · 2.11 GB</option><option value="fp32">FP32 · 8.21 GB</option></select></label>
<label><input id="cache" type="checkbox" checked> Cache weights on this device</label>
<label>Sequence<textarea id="sequence" rows="3" cols="70">NLYIQWLKDGGPSSGRPPPS</textarea></label>
<label>Conditioning PDB <input type="file" id="pdb" accept=".pdb"></label><button id="clear">Clear backbone</button>
<label>Task <select id="mode"><option value="forward">Forward logits</option><option value="sequence">Fill sequence / inverse fold</option><option value="structure">Fold structure</option></select></label><label>Steps <input id="steps" type="number" min="1" max="100" value="8" style="width:65px"></label>
<div class="controls"><button id="load">Load model</button><button id="run" disabled>Run</button><button id="cancel" disabled>Cancel</button><button id="release" disabled>Release GPU</button><button id="download" disabled>Download result</button></div>
<progress id="progress" value="0" max="1"></progress><pre id="status" role="status">Ready to load. HTTPS or localhost and a hardware WebGPU adapter are required.</pre><canvas id="view" width="1000" height="340" aria-label="Backbone projection"></canvas>
<script type="module" src="./app.js"></script></html>
